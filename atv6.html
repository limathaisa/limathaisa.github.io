<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <script src="atv6.js"></script>
  <title>Data por Extenso</title>
</head>
<body>
  <h2>Converter Data para Extenso</h2>

  <label for="data">Digite sua data de nascimento (dd/mm/aaaa):</label><br><br>
  <input type="text" id="data" placeholder="dd/mm/aaaa" /><br><br>
  
  <button onclick="converterData()">Converter</button>

  <div id="resultado" style="margin-top: 15px;"></div>
<script>

  function converterData() {
    const meses = [
      "janeiro", "fevereiro", "março", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
    ];
    
    const data = document.getElementById("data").value;
    const [dia, mes, ano] = data.split("/");
  
    if (dia && mes && ano && dia.length === 2 && mes.length === 2 && ano.length === 4) {
      const dataExtenso = `${dia} de ${meses[parseInt(mes) - 1]} de ${ano}`;
      document.getElementById("resultado").innerText = dataExtenso;
    } else {
      document.getElementById("resultado").innerText = "Data inválida! Por favor, insira no formato dd/mm/aaaa.";
    }
  }
  
</script>
</body>
</html>
