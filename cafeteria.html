<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cafeteria do CEFET-RJ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 30px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    .menu, .cart {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex: 1;
    }
    
  </style>
  </head>
<body>

  <div class="menu">
    <h1>Cardápio</h1>
    <div id="menu-list"></div>
  </div>

  <div class="cart">
    <h1>Itens Comprados</h1>
    <div id="cart-list"></div>
    <div class="total" id="total"></div>
  </div>
  </body>
</html>
