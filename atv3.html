<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="atv3.js"></script>
    <title>Contador de Palavras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: rgb(0, 0, 0);
        }
h1{
    background-color: blueviolet;
}

    </style>
</head>
<body>

    <h1>Contador de Palavras</h1>

    <label for="texto">Digite seu texto abaixo:</label><br>
    <textarea id="texto" rows="6" placeholder="Ex: Era uma vez uma casa muito engraçada..."></textarea><br><br>

    <button onclick="contarPalavras()">Contar Palavras</button>

    <h2>Resultado:</h2>
    <div id="resultado"></div>
   <script>
       function contarPalavras() {
    var texto = document.getElementById('texto').value;

    var textoMinusculo = "";
    for (var i = 0; i < texto.length; i++) {
        var charCode = texto.charCodeAt(i);
        if (charCode >= 65 && charCode <= 90) {
            textoMinusculo += String.fromCharCode(charCode + 32);
        } else {
            textoMinusculo += texto[i];
        }
    }

    var pontuacoes = ['.', ',', '!', '?', ';', ':', '(', ')', '"', '“', '”'];
    var textoLimpo = "";
    for (var i = 0; i < textoMinusculo.length; i++) {
        var caractere = textoMinusculo[i];
        var ehPontuacao = false;
        for (var j = 0; j < pontuacoes.length; j++) {
            if (caractere === pontuacoes[j]) {
                ehPontuacao = true;
                break;
            }
        }
        if (!ehPontuacao) {
            textoLimpo += caractere;
        }
    }

    var palavras = [];
    var palavra = "";
    for (var i = 0; i < textoLimpo.length; i++) {
        var c = textoLimpo[i];
        if (c === ' ' || c === '\n' || c === '\t') {
            if (palavra !== "") {
                palavras.push(palavra);
                palavra = "";
            }
        } else {
            palavra += c;
        }
    }
    if (palavra !== "") {
        palavras.push(palavra);
    }

    var contagem = {};
    for (var i = 0; i < palavras.length; i++) {
        var p = palavras[i];
        if (contagem[p] === undefined) {
            contagem[p] = 1;
        } else {
            contagem[p]++;
        }
    }

    var tabela = "<table><tr><th>Palavra</th><th>Ocorrências</th></tr>";
    for (var palavra in contagem) {
        tabela += "<tr><td>" + palavra + "</td><td>" + contagem[palavra] + "</td></tr>";
    }
    tabela += "</table>";

    document.getElementById("resultado").innerHTML = tabela;
}
   </script>
    
</body>
</html>
